<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LiveVoice · Todo en uno</title>
<style>
  /* Una sola fuente de navegador 1920x1080 con los overlays principales colocados. */
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
  iframe { position: absolute; border: 0; background: transparent; }
  #alerts { inset: 0; width: 100%; height: 100%; }
  #tts { left: 25%; bottom: 2%; width: 50%; height: 22%; }
  #goal { left: 34%; top: 1%; width: 32%; height: 11%; }
  #chat { right: 0; bottom: 0; width: 24%; height: 65%; }
  #events { left: .5%; top: 1%; width: 19%; height: 32%; }
  #command { left: 0; bottom: 0; width: 30%; height: 30%; }
</style>
</head>
<body>
<script>
  // ?hide=chat,events oculta piezas. El resto de parámetros (accent, size, preview) se pasan a cada overlay.
  const params = new URLSearchParams(location.search);
  const hidden = (params.get("hide") || "").split(",");
  params.delete("hide");
  const query = params.toString() ? `?${params}` : "";
  const parts = [["events", "events"], ["goal", "goal"], ["chat", "chat"], ["command", "command"], ["tts", "tts"], ["alerts", "alerts"]];
  for (const [id, name] of parts) {
    if (hidden.includes(id)) continue;
    const frame = document.createElement("iframe");
    frame.id = id;
    frame.src = `/overlay/${name}${query}`;
    frame.setAttribute("allowtransparency", "true");
    document.body.append(frame);
  }
</script>
</body>
</html>
