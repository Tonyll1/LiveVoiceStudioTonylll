<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LiveVoice · Comandos</title>
<link rel="stylesheet" href="/overlays/overlay.css">
<style>
  body { width: 100vw; height: 100vh; font-size: var(--font); }
  #stack { position: absolute; left: .6em; bottom: .6em; display: flex; flex-direction: column; gap: .4em; }
  .c { display: flex; align-items: center; gap: .5em; background: var(--card); border-radius: .9em; padding: .45em .9em; border-left: 4px solid var(--accent-2);
    animation: pop-in .45s cubic-bezier(.2,1.4,.4,1) both; }
  .c.out { animation: fade-out .5s ease forwards; }
  .cmd { font-family: Consolas, monospace; font-weight: 900; color: var(--accent-2); filter: brightness(1.3); }
  .media { max-width: 40vw; max-height: 45vh; border-radius: .8em; filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
  .out { animation: fade-out .5s ease forwards !important; }
</style>
</head>
<body>
<div id="stack"></div>
<script type="module">
  import { connect, esc, isPreview, pf } from "/overlays/overlay.js";
  const stack = document.getElementById("stack");
  function show(data) {
    const el = document.createElement("div");
    el.style.cssText = "display:flex;flex-direction:column;align-items:flex-start;gap:.4em;animation:pop-in .45s cubic-bezier(.2,1.4,.4,1) both";
    const src = esc(data.media || "");
    const media = !data.media ? ""
      : data.media_type === "video" ? `<video class="media" src="${src}" autoplay playsinline></video>`
      : `<img class="media" src="${src}">`;
    el.innerHTML = `${media}<div class="c">🔊 ${pf(data.platform)} <b class="shadow-text">${esc(data.user.name)}</b> usó <span class="cmd">${esc(data.name)}</span></div>`;
    stack.append(el);
    while (stack.children.length > 3) stack.firstElementChild.remove();
    const duration = (data.duration || (data.media ? 6 : 4)) * 1000;
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 500); }, duration);
  }
  connect({ command: show });
  if (isPreview) show({ name: "!susto", platform: "twitch", user: { name: "gamer_pro" } });
</script>
</body>
</html>
