<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LiveVoice · Chat</title>
<link rel="stylesheet" href="/overlays/overlay.css">
<style>
  body { width: 100vw; height: 100vh; }
  #chat { position: absolute; inset: auto 0 0 0; display: flex; flex-direction: column; gap: .45em; padding: .6em; font-size: calc(var(--font) * .82); }
  .m { background: var(--card); border-radius: .9em; padding: .55em .8em; animation: slide-in .35s ease both; border-left: 4px solid var(--accent); transition: opacity .6s, transform .6s; }
  .m.event { border-left-color: #fbbf24; background: linear-gradient(90deg, rgba(251,191,36,.25), var(--card)); }
  .m.gone { opacity: 0; transform: translateX(-20px); }
  .who { font-weight: 800; display: flex; align-items: center; gap: .4em; }
  .badge { font-size: .7em; padding: .1em .45em; border-radius: .4em; background: rgba(255,255,255,.15); font-weight: 700; }
  .badge.mod { background: #16a34a; } .badge.sub { background: #9333ea; }
  .t { margin-top: .15em; line-height: 1.3; word-wrap: break-word; }
</style>
</head>
<body>
<div id="chat"></div>
<script type="module">
  import { connect, esc, isPreview, params, pf } from "/overlays/overlay.js";

  const box = document.getElementById("chat");
  let settings = { chat_max: 8, chat_fade_seconds: 0, show_platform_icon: true };
  const EVENTS = {
    follow: () => "empezó a seguir 💜", gift: (e) => `envió ${e.amount}× ${esc(e.gift)} 🎁`, sub: () => "se suscribió ⭐",
    bits: (e) => `envió ${e.amount} bits 💎`, raid: (e) => `llegó con ${e.amount} personas 🚀`, share: () => "compartió el directo 🔁",
  };

  function add(event) {
    const isChat = event.kind === "chat";
    if (!isChat && !EVENTS[event.kind]) return;
    if (params.get("events") === "0" && !isChat) return;
    const u = event.user;
    const el = document.createElement("div");
    el.className = `m ${isChat ? "" : "event"}`;
    const color = u.color ? `style="color:${esc(u.color)}"` : "";
    el.innerHTML = `<div class="who">${settings.show_platform_icon ? pf(event.platform) : ""}<span ${color}>${esc(u.name)}</span>
      ${u.is_moderator && !u.is_broadcaster ? '<span class="badge mod">MOD</span>' : ""}${u.is_subscriber ? '<span class="badge sub">SUB</span>' : ""}</div>
      <div class="t shadow-text">${isChat ? esc(event.text).replace(/\[emote:\d+:([^\]]+)\]/g, "$1") : EVENTS[event.kind](event)}</div>`;
    box.append(el);
    while (box.children.length > (Number(params.get("max")) || settings.chat_max || 8)) box.firstElementChild.remove();
    const fade = Number(params.get("fade") ?? settings.chat_fade_seconds) || 0;
    if (fade) setTimeout(() => { el.classList.add("gone"); setTimeout(() => el.remove(), 700); }, fade * 1000);
  }

  connect({
    hello: (data) => { settings = { ...settings, ...data.overlay }; (data.recent || []).slice(-settings.chat_max).forEach(add); },
    "overlay.config": (data) => (settings = { ...settings, ...data }),
    event: add,
  });
  if (isPreview) {
    add({ kind: "chat", platform: "twitch", text: "¡Qué buena jugada!", user: { name: "gamer_pro", color: "#a970ff", is_subscriber: true } });
    add({ kind: "chat", platform: "tiktok", text: "Saludos desde México 🇲🇽", user: { name: "Ana" } });
    add({ kind: "follow", platform: "kick", user: { name: "nuevo_fan" } });
  }
</script>
</body>
</html>
